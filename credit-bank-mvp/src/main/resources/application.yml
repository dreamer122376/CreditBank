server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true：库不存在会自动建，省得手动 CREATE DATABASE
    url: jdbc:mysql://localhost:3306/credit_bank?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456          # ← 改成你自己的 MySQL 密码

  # 启动时自动执行下面的建表 + 初始化数据脚本
  sql:
    init:
      mode: always            # 学习期用 always，每次启动重建；正式开发改成 never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher   # 兼容 springdoc（Swagger）

mybatis-plus:
  configuration:
    # 把执行的 SQL 打到控制台，方便你直观看到"Service 调 Mapper 后到底发了什么 SQL"
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Swagger 接口文档地址：http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
