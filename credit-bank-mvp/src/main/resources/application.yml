server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/credit_bank?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  sql:
    init:
      mode: never

  redis:
    host: localhost
    port: 6379
    password: 123456
    database: 0
    timeout: 10000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  web:
    resources:
      static-locations: classpath:/static/,file:./uploads/

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: creditbank-jwt-secret-key-2026-07-11
  expire: 86400000
