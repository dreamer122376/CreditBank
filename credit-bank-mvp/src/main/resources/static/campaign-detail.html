<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动详情 · 学分银行</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <!-- 侧边栏（根据角色动态渲染） -->
    <div class="sidebar" id="sidebar"></div>

    <!-- 主区域 -->
    <div class="main">
        <div class="topbar">
            <div class="page-title">活动详情</div>
            <div class="user-area" id="topbarUser"></div>
        </div>

        <div class="content">
            <div id="detailContainer">
                <div class="empty-state">加载中...</div>
            </div>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>
    const user = Auth.requireLogin();
    if (!user) throw new Error('未登录');

    renderTopbar('topbarUser', user);
    renderSidebar();

    const id = getQuery('id');
    if (!id) {
        document.getElementById('detailContainer').innerHTML =
            '<div class="empty-state">❌ 缺少活动ID参数</div>';
    } else {
        loadDetail();
    }

    // ========== 角色侧边栏 ==========
    function renderSidebar() {
        const MENUS = {
            SYSTEM_ADMIN: [
                ['工作台', 'home-system-admin.html'], ['管理用户管理', null], ['机构管理', null],
                ['积分规则管理', null], ['转换规则管理', null], ['认证标准管理', null],
                ['业务流程管理', null], ['项目管理', null], ['平台活动管理', 'campaign-manage.html'],
                ['专家管理', null], ['交易管理', null]
            ],
            INSTITUTION_ADMIN: [
                ['工作台', 'home-institution-admin.html'], ['机构信息', null], ['积分规则管理', null],
                ['业务流程管理', null], ['项目管理', null], ['专家管理', null], ['积分池流水', null]
            ],
            STUDENT: [
                ['我的主页', 'home-student.html'], ['机构主页', null], ['积分规则', null],
                ['学分转积分', null], ['认证标准', null], ['我的申请', null],
                ['项目报名', null], ['参与活动', 'campaign-student.html'], ['专家简介', null], ['我的钱包', null]
            ],
            EXPERT: [
                ['我的主页', 'home-expert.html'], ['审批待办', null], ['项目评审', null],
                ['聘用机构', null], ['个人信息', null], ['项目流水', null]
            ]
        };
        const menu = MENUS[user.userType] || [];
        const isAdmin = user.userType === 'SYSTEM_ADMIN';
        document.getElementById('sidebar').innerHTML =
            '<div class="brand">学分银行<small>' + (ROLE_NAME[user.userType] || '') + '中心</small></div>' +
            '<div class="menu">' + menu.map(m => {
                const label = m[0], url = m[1];
                const isActive = (url === 'campaign-manage.html' || url === 'campaign-student.html');
                const onclick = url ? "location.href='" + url + "'" : "goFunc('" + label + "')";
                return '<div class="menu-item' + (isActive ? ' active' : '') + '" onclick="' + onclick + '">' + label + '</div>';
            }).join('') + '</div>';
        window.isAdmin = isAdmin;
    }

    // ========== 加载详情 ==========
    function loadDetail() {
        fetch('/api/campaigns/' + id)
            .then(r => r.json())
            .then(res => {
                if (res.code === 200 && res.data) {
                    renderDetail(res.data);
                } else {
                    document.getElementById('detailContainer').innerHTML =
                        '<div class="empty-state">❌ ' + (res.message || '活动不存在') + '</div>';
                }
            })
            .catch(e => {
                document.getElementById('detailContainer').innerHTML =
                    '<div class="empty-state">❌ 加载失败：' + e.message + '</div>';
            });
    }

    function renderDetail(c) {
        const statusClass = c.status === 1 ? 'tag-green' : (c.status === 2 ? 'tag-gray' : 'tag-blue');
        const statusText = c.status === 1 ? '进行中' : (c.status === 2 ? '已结束' : '未开始');
        const hasMultiplier = c.multiplier && c.multiplier > 1.0;
        const coverHtml = c.coverImage
            ? '<div class="detail-cover" style="background-image:url(' + c.coverImage + ')"></div>'
            : '<div class="detail-cover detail-cover-empty"><span>' + escapeHtml(c.title) + '</span></div>';

        const descHtml = (c.description || '暂无活动详情')
            .split('\n').filter(function(l) { return l.trim(); })
            .map(function(l) { return '<p>' + escapeHtml(l) + '</p>'; }).join('');

        let adminBtns = '';
        if (window.isAdmin) {
            adminBtns = `
                <button class="btn btn-primary" onclick="editCampaign(${c.id})">📝 编辑</button>
                <button class="btn btn-danger" onclick="deleteCampaign(${c.id})">🗑️ 删除</button>
            `;
        }

        const backUrl = window.isAdmin ? 'campaign-manage.html' : 'campaign-student.html';

        document.getElementById('detailContainer').innerHTML = `
            ${coverHtml}

            <div class="detail-info-card">
                <h2 class="detail-title">${escapeHtml(c.title)}</h2>
                <div class="detail-meta-grid">
                    <div class="detail-meta-item">
                        <span class="meta-icon">🕐</span>
                        <div>
                            <div class="meta-label">活动时间</div>
                            <div class="meta-value">${formatDate(c.startTime)} ~ ${formatDate(c.endTime)}</div>
                        </div>
                    </div>
                    <div class="detail-meta-item">
                        <span class="meta-icon">🏛️</span>
                        <div>
                            <div class="meta-label">主办方</div>
                            <div class="meta-value">${escapeHtml(c.organizer || '未设置')}</div>
                        </div>
                    </div>
                    <div class="detail-meta-item">
                        <span class="meta-icon">🎯</span>
                        <div>
                            <div class="meta-label">积分倍率</div>
                            <div class="meta-value">
                                ${hasMultiplier
                                    ? '<span class="multiplier-highlight">' + c.multiplier + 'x 积分翻倍</span>'
                                    : '<span class="text-muted">无积分奖励</span>'}
                            </div>
                        </div>
                    </div>
                    <div class="detail-meta-item">
                        <span class="meta-icon">🏷️</span>
                        <div>
                            <div class="meta-label">状态</div>
                            <div class="meta-value"><span class="tag ${statusClass}">${statusText}</span></div>
                        </div>
                    </div>
                    <div class="detail-meta-item">
                        <span class="meta-icon">📅</span>
                        <div>
                            <div class="meta-label">创建时间</div>
                            <div class="meta-value">${formatDate(c.createdAt)}</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="detail-content-card">
                <h3>📝 活动详情</h3>
                <div class="detail-desc">${descHtml}</div>
            </div>

            <div class="detail-actions">
                <button class="btn btn-outline" onclick="location.href='${backUrl}'">← 返回列表</button>
                ${adminBtns}
            </div>
        `;
    }

    // ========== 管理操作 ==========
    function editCampaign(id) {
        location.href = 'campaign-manage.html?edit=' + id;
    }

    function deleteCampaign(id) {
        if (!confirm('确定要删除该活动吗？此操作不可恢复。')) return;
        fetch('/api/campaigns/' + id, { method: 'DELETE' })
            .then(r => r.json())
            .then(res => {
                if (res.code === 200) {
                    location.href = 'campaign-manage.html';
                } else {
                    alert(res.message);
                }
            });
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        if (dateStr.length >= 16) return dateStr.substring(0, 16).replace('T', ' ');
        return dateStr;
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
</body>
</html>
