<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参与活动 · 学分银行</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="brand">
            学分银行
            <small>学生中心</small>
        </div>
        <div class="menu">
            <div class="menu-item" onclick="location.href='home-student.html'">我的主页</div>
            <div class="menu-item" onclick="goFunc('机构管理')">机构主页</div>
            <div class="menu-item" onclick="goFunc('积分规则管理')">积分规则</div>
            <div class="menu-item" onclick="goFunc('转换规则管理')">学分转积分</div>
            <div class="menu-item" onclick="goFunc('认证标准管理')">认证标准</div>
            <div class="menu-item" onclick="goFunc('业务流程管理')">我的申请</div>
            <div class="menu-item" onclick="goFunc('项目管理')">项目报名</div>
            <div class="menu-item active" onclick="location.href='campaign-student.html'">参与活动</div>
            <div class="menu-item" onclick="goFunc('专家管理')">专家简介</div>
            <div class="menu-item" onclick="goFunc('交易管理')">我的钱包</div>
        </div>
    </div>

    <!-- 主区域 -->
    <div class="main">
        <div class="topbar">
            <div class="page-title">参与活动</div>
            <div class="user-area" id="topbarUser"></div>
        </div>

        <div class="content">
            <!-- 进行中活动卡片 -->
            <div class="campaign-grid" id="campaignGrid">
                <div class="empty-state">加载中...</div>
            </div>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>
    const user = Auth.requireRole('STUDENT');
    if (user) {
        renderTopbar('topbarUser', user);
    }

    init();

    function init() {
        loadActiveCampaigns();
    }

    function loadActiveCampaigns() {
        fetch('/api/campaigns/active')
            .then(r => r.json())
            .then(res => {
                if (res.code === 200) {
                    renderGrid(res.data);
                } else {
                    showError(res.message);
                }
            })
            .catch(e => showError('加载失败：' + e.message));
    }

    function renderGrid(campaigns) {
        const grid = document.getElementById('campaignGrid');

        if (!campaigns || campaigns.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <h3>暂无进行中的活动</h3>
                    <p>当前没有正在进行中的平台活动，请关注后续活动通知。</p>
                    <button class="btn btn-primary" onclick="location.href='home-student.html'">← 返回主页</button>
                </div>`;
            return;
        }

        let html = '';
        campaigns.forEach(c => {
            const coverStyle = c.coverImage
                ? 'background-image:url(' + c.coverImage + ')'
                : 'background:linear-gradient(135deg, #3b5bdb 0%, #6c8ae4 100%)';
            const hasMultiplier = c.multiplier && c.multiplier > 1.0;
            const multText = hasMultiplier
                ? '<span class="card-badge-bonus">' + c.multiplier + 'x 积分翻倍</span>'
                : '';

            html += `
                <div class="campaign-card" onclick="location.href='campaign-detail.html?id=${c.id}'">
                    <div class="card-cover" style="${coverStyle}">
                        ${c.coverImage ? '' : '<span class="card-cover-text">' + escapeHtml(c.title) + '</span>'}
                        ${multText}
                    </div>
                    <div class="card-body">
                        <div class="card-title">${escapeHtml(c.title)}</div>
                        <div class="card-meta">
                            <span>🕐 ${formatDate(c.startTime)} ~ ${formatDate(c.endTime)}</span>
                        </div>
                        ${c.organizer ? '<div class="card-meta">🏛️ ' + escapeHtml(c.organizer) + '</div>' : ''}
                        <div class="card-desc-preview">${escapeHtml((c.description || '').substring(0, 80))}${(c.description || '').length > 80 ? '...' : ''}</div>
                        <div class="card-footer">
                            <span class="tag tag-green">进行中</span>
                            <span class="card-link">查看详情 →</span>
                        </div>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        if (dateStr.length >= 16) return dateStr.substring(0, 16).replace('T', ' ');
        return dateStr;
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function showError(msg) {
        document.getElementById('campaignGrid').innerHTML = '<div class="empty-state">❌ ' + escapeHtml(msg) + '</div>';
    }
</script>
</body>
</html>
