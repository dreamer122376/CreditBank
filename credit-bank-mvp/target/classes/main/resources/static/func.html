<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能页 · 学分银行</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <!-- 侧边栏（动态生成，根据当前角色） -->
    <div class="sidebar" id="sidebar"></div>

    <!-- 主区域 -->
    <div class="main">
        <div class="topbar">
            <div class="page-title" id="pageTitle">功能页</div>
            <div class="user-area" id="topbarUser"></div>
        </div>

        <div class="content">
            <div class="func-placeholder">
                <div class="icon">🚧</div>
                <h2 id="funcName">功能开发中</h2>
                <p id="funcDesc">该功能页面尚在开发中，后续将在此实现具体业务逻辑。</p>
                <button class="btn btn-primary" onclick="goBack()">← 返回工作台</button>
            </div>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>
    const user = Auth.requireLogin();
    if (!user) throw new Error('未登录');

    const funcName = getQuery('name') || '功能页';
    const sub = getQuery('sub');
    const title = sub ? (funcName + ' · ' + sub) : funcName;

    document.getElementById('pageTitle').textContent = title;
    document.getElementById('funcName').textContent = funcName + (sub ? '（' + sub + '）' : '');
    document.getElementById('funcDesc').textContent =
        '该功能属于「' + funcName + '」模块' + (sub ? '，当前子功能：' + sub : '') + '，具体业务逻辑后续实现。';
    renderTopbar('topbarUser', user);

    // 根据角色渲染侧边栏菜单（与各主页菜单保持完全一致）
    // 格式：[显示名称, URL或null, 功能名]
    // 显示名称：与主页面一致，各角色个性化
    // URL：非空表示直接跳转页面，null表示跳转到功能页
    // 功能名：用于激活状态判断和goFunc调用（必须与主页面goFunc参数一致）
    const MENUS = {
        SYSTEM_ADMIN: [
            ['工作台', 'home-system-admin.html', '工作台'],
            ['管理用户管理', null, '管理用户管理'],
            ['机构管理', null, '机构管理'],
            ['积分规则管理', null, '积分规则管理'],
            ['转换规则管理', null, '转换规则管理'],
            ['认证标准管理', null, '认证标准管理'],
            ['业务流程管理', null, '业务流程管理'],
            ['项目管理', null, '项目管理'],
            ['平台活动管理', null, '平台活动管理'],
            ['专家管理', null, '专家管理'],
            ['交易管理', null, '交易管理']
        ],
        INSTITUTION_ADMIN: [
            ['工作台', 'home-institution-admin.html', '工作台'],
            ['机构信息', null, '机构管理'],
            ['积分规则管理', null, '积分规则管理'],
            ['业务流程管理', null, '业务流程管理'],
            ['项目管理', null, '项目管理'],
            ['专家管理', null, '专家管理'],
            ['积分池流水', null, '交易管理']
        ],
        STUDENT: [
            ['我的主页', 'home-student.html', '工作台'],
            ['机构主页', null, '机构管理'],
            ['积分规则', null, '积分规则管理'],
            ['学分转积分', null, '转换规则管理'],
            ['认证标准', null, '认证标准管理'],
            ['我的申请', null, '业务流程管理'],
            ['项目报名', null, '项目管理'],
            ['参与活动', null, '平台活动管理'],
            ['专家简介', null, '专家管理'],
            ['我的钱包', null, '交易管理']
        ],
        EXPERT: [
            ['我的主页', 'home-expert.html', '工作台'],
            ['审批待办', null, '业务流程管理'],
            ['项目评审', null, '项目管理'],
            ['聘用机构', null, '机构管理'],
            ['个人信息', null, '专家管理'],
            ['项目流水', null, '交易管理']
        ]
    };

    const menu = MENUS[user.userType] || [];
    document.getElementById('sidebar').innerHTML =
        '<div class="brand">学分银行<small>' + (ROLE_NAME[user.userType] || '') + '中心</small></div>' +
        '<div class="menu">' + menu.map((m) => {
            const displayName = m[0];
            const url = m[1];
            const funcNameKey = m[2];
            const isActive = (funcNameKey === funcName || (funcName === '功能页' && funcNameKey === '工作台'));
            const onclick = url ? "location.href='" + url + "'" : "goFunc('" + funcNameKey + "')";
            return '<div class="menu-item' + (isActive ? ' active' : '') + '" onclick="' + onclick + '">' +
                   displayName + '</div>';
        }).join('') + '</div>';

    function goBack() {
        location.href = ROLE_HOME[user.userType];
    }
</script>
</body>
</html>
