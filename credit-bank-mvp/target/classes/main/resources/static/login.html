<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学分银行系统 · 登录</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
    <div class="login-box">
        <div class="logo">
            <h1>终身学习学分银行</h1>
            <p>Credit Bank System</p>
        </div>

        <!-- 登录 / 注册 切换 -->
        <div class="login-tabs">
            <div class="tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
            <div class="tab" id="tabRegister" onclick="switchTab('register')">注册</div>
        </div>

        <!-- 登录表单 -->
        <div id="loginForm">
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="btn btn-primary btn-block" onclick="doLogin()">登 录</button>
            <p class="login-msg" id="loginMsg"></p>
            <div class="login-tip">
                <b>演示账号（密码均为 123456）：</b><br>
                admin · 系统管理员　　instadmin · 机构管理员<br>
                student · 学生　　　　expert · 专家
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" style="display:none;">
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="regUsername" placeholder="请设置登录账号">
            </div>
            <div class="form-group">
                <label>真实姓名</label>
                <input type="text" id="regRealName" placeholder="请输入真实姓名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请设置密码">
            </div>
            <div class="form-group">
                <label>角色类型</label>
                <select id="regUserType" onchange="toggleInstField()">
                    <option value="STUDENT">学生</option>
                    <option value="INSTITUTION_ADMIN">机构管理员</option>
                    <option value="EXPERT">专家</option>
                    <option value="SYSTEM_ADMIN">系统管理员</option>
                </select>
            </div>
            <div class="form-group" id="instField">
                <label>所属机构ID（学生/机构管理员填写）</label>
                <input type="number" id="regInstitutionId" placeholder="如：1">
            </div>
            <div class="form-group" id="instNameField">
                <label>所属机构名称（专家填写所在单位）</label>
                <input type="text" id="regInstitutionName" placeholder="如：清华大学">
            </div>
            <button class="btn btn-success btn-block" onclick="doRegister()">注 册</button>
            <p class="login-msg" id="regMsg"></p>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>
    // 已登录则直接跳转主页
    if (Auth.current()) {
        location.href = ROLE_HOME[Auth.current().userType];
    }

    function switchTab(type) {
        const isLogin = type === 'login';
        document.getElementById('tabLogin').classList.toggle('active', isLogin);
        document.getElementById('tabRegister').classList.toggle('active', !isLogin);
        document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
        document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
    }

    // 注册时根据角色显示/隐藏机构字段
    function toggleInstField() {
        const type = document.getElementById('regUserType').value;
        const showInstId = (type === 'STUDENT' || type === 'INSTITUTION_ADMIN');
        const showInstName = (type === 'EXPERT');
        document.getElementById('instField').style.display = showInstId ? 'block' : 'none';
        document.getElementById('instNameField').style.display = showInstName ? 'block' : 'none';
    }

    function doLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const msgEl = document.getElementById('loginMsg');
        if (!username || !password) { msgEl.textContent = '请输入账号和密码'; return; }

        const user = mockLogin(username, password);
        if (!user) { msgEl.textContent = '账号或密码错误'; return; }

        Auth.login(user);
        location.href = ROLE_HOME[user.userType];
    }

    function doRegister() {
        const form = {
            username:  document.getElementById('regUsername').value.trim(),
            password:  document.getElementById('regPassword').value.trim(),
            realName:  document.getElementById('regRealName').value.trim(),
            userType:  document.getElementById('regUserType').value,
            institutionId:   document.getElementById('regInstitutionId').value,
            institutionName: document.getElementById('regInstitutionName').value.trim()
        };
        const msgEl = document.getElementById('regMsg');
        if (!form.username || !form.password || !form.realName) {
            msgEl.textContent = '请填写完整信息';
            return;
        }
        const user = mockRegister(form);
        Auth.login(user);
        location.href = ROLE_HOME[user.userType];
    }

    // 回车键登录
    document.getElementById('loginPassword').addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
